<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Generar entrada · Entradas QR</title>
    <link
        rel="icon"
        href="/static/favicon.ico"
        type="image/x-icon"
    >

    <link
        rel="stylesheet"
        href="/static/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >
</head>

<body class="app-page">

    <main class="app-shell">

        <header class="page-header">
            <div>
                <a
                    class="back-link"
                    href="/"
                >
                    ← Volver
                </a>

                <p class="app-eyebrow">
                    Gestión de entradas
                </p>

                <h1>Generar entrada</h1>

                <p class="page-description">
                    Registra los datos del asistente y genera su entrada.
                </p>
            </div>
        </header>

        <section class="card">

            <form
                id="generar-form"
                class="entry-form"
            >

                <div class="form-group">
                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        autocomplete="name"
                        required
                        placeholder="Nombre del asistente"
                    >
                </div>

                <div class="form-group">
                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        id="telefono"
                        name="telefono"
                        type="tel"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="tel"
                        placeholder="Teléfono"
                    />
                </div>

                <div class="form-group">
                    <label for="forma_pago">
                        Forma de pago
                    </label>

                    <select
                        id="forma_pago"
                        name="forma_pago"
                        required
                    >
                        <option value="">
                            Selecciona una opción
                        </option>

                        <option value="YAPE / PLIN">
                            Yape/Plin
                        </option>

                        <option value="EFECTIVO">
                            Efectivo
                        </option>

                        <option value="CORTESÍA">
                            Cortesía
                        </option>
                    </select>
                </div>

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Generar entrada
                </button>

                <p
                    id="form-error"
                    class="form-error"
                    role="alert"
                    hidden
                ></p>

            </form>

        </section>

        <section
            id="resultado"
            class="card result-card"
            hidden
        >

            <p class="app-eyebrow">
                Entrada generada
            </p>

            <h2 id="resultado-nombre"></h2>

            <img
                id="resultado-imagen"
                class="ticket-preview"
                alt="Entrada generada"
            >

            <div class="result-actions">

                <a
                    id="resultado-link"
                    class="button button-primary"
                    target="_blank"
                    rel="noopener"
                >
                    Abrir entrada
                </a>

                <button
                    id="copiar-link"
                    class="button button-ghost"
                    type="button"
                >
                    Copiar enlace
                </button>

            </div>

        </section>

    </main>

    <script src="/static/js/app.js"></script>

</body>
</html>

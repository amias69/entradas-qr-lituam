<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entradas QR · Iniciar sesión</title>
    <link
        rel="icon"
        href="/static/favicon.ico"
        type="image/x-icon"
    >

    <link
        rel="stylesheet"
        href="/static/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <header class="login-header">
                <div class="login-logo">
                    <img
                        src="/static/img/logo.png"
                        alt="Lituam Perú"
                    >
                </div>

                <p class="login-eyebrow">
                    Gestión de entradas
                </p>

                <div class="brand-stack">
                    <div class="brand-legado brand-legado-gold">
                        LEGADO
                    </div>

                    <div class="brand-legado brand-legado-white">
                        X ANIVERSARIO
                    </div>
                </div>

                <p class="login-description">
                    Inicia sesión para continuar.
                </p>
            </header>

            <form
                class="login-form"
                action="/login"
                method="post"
            >

                <div class="form-group">
                    <label for="username">
                        Usuario
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                {% if error %}
                    <p
                        class="form-error"
                        role="alert"
                    >
                        {{ error }}
                    </p>
                {% endif %}

                <button
                    class="button button-primary"
                    type="submit"
                >
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

</body>
</html>
